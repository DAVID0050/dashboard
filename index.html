copic Nonaffine Deformation Theory of LAOS in Polymers", "arxiv": "2605.21021", "doi": "", "rating": "★★★★", "core": "连接大振幅振荡剪切非线性与非仿射弛豫，用分子框架预测高次谐波。", "abstract": "建立分子驱动框架，将纠缠聚合物LAOS非线性连接到频率依赖的非仿射弛豫。一次谐波测量残余锁相弹性响应，高次谐波编码应变依赖的非仿射弛豫的傅里叶特征。", "reason": "Zaccone是非仿射弹性理论的主要推手。这篇直接连到聚合物黏弹性的非线性区——你的Rouse模型目前是线性的，非线性区域的理论可能是课题一的自然延伸。", "authors": ""}, {"title": "Self-organization and memory formation in two-dimensional jammed deformable matter under cyclic compression", "arxiv": "2605.22398", "doi": "", "rating": "★★★★", "core": "可变形环组装体在循环压缩下自组织形成记忆，多分散系统收敛到滞后极限环。", "abstract": "无热条件下可变形环组装体对准静态压缩的力学响应。过堵塞后环屈曲导致软化。循环压缩下多分散系统收敛到稳定滞后极限环——形成力学记忆。", "reason": "\"记忆形成\"和\"极限环\"是你FG弛豫分析的核心概念。这篇虽然不是聚合物，但力学记忆的形成机制可能给你的弛豫分析提供类比——FG弛豫是否也有类似的\"收敛到稳定路径\"特征？", "authors": ""}, {"title": "Anomalous Diffusion as Structural Memory: An Extended Structural Dynamics Approach", "arxiv": "2605.16337", "doi": "", "rating": "★★★★", "core": "亚扩散不是反常，是结构记忆——完整相空间（平动+取向+变形）投影到平动子空间产生记忆核。", "abstract": "生物系统亚扩散源于不完整相空间。ESD框架中每个粒子有平动/取向/变形自由度，投影到平动子空间自然产生记忆核。", "reason": "FG弛豫的R(s,t)本质是追踪结构记忆衰减。这篇提供第一性原理框架——不只标度指数，还能量化内部自由度和平动自由度的贡献。", "authors": ""}, {"title": "Actin cross-linking organizes basal body patterning through anomalous diffusion transitions", "arxiv": "2605.15912", "doi": "", "rating": "★★★★", "core": "肌动蛋白交联通过反常扩散转变组织基体图案——交联密度控制扩散模式切换。", "abstract": "亚细胞结构的动力学反映胞内环境的力学约束。反常扩散与布朗运动之间的转变对亚细胞组织至关重要。", "reason": "\"交联控制扩散模式\"是你课题的核心物理图像——交联拓扑决定弛豫谱。这篇虽然是细胞生物学层面，但物理逻辑和你的一致：交联密度→动力学转变。可以看看他们的分析方法能否平移。", "authors": ""}, {"title": "Interaction Controlled Molecular Probing of Length Scale Dependent Glassy Dynamics in Polymer Melts", "arxiv": "2605.21298", "doi": "", "rating": "★★★", "core": "探针-宿主相互作用强度决定聚合物熔体玻璃动力学的测量长度尺度。", "abstract": "用分子动力学模拟超冷聚合物熔体中稀探针二聚体，发现探针-宿主相互作用强度决定测量的动态异质性长度尺度。", "reason": "偏物理，和黏弹性相关。虽然不是生物物理方向，但聚合物弛豫的长度尺度依赖性对你的FG分析可能有用。", "authors": ""}, {"title": "The fracture resistance of elastic networks increases with the density of defects like a random walk", "arxiv": "2605.1 <script>
var PAPER_DATA = JSON.parse(document.getElementById('paper-data-json').textContent);
var PRX_DATA = JSON.parse(document.getElementById('prx-data-json').textContent);
var STORAGE_KEY = 'dashboard_v3';

function lsGet() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}; } catch(e) { return {}; } }
function lsSet(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
function getRating(a) { var s=lsGet(); return (s.ratings&&s.ratings[a])||0; }
function setRating(a, v) { var s=lsGet(); if(!s.ratings)s.ratings={}; s.ratings[a]=v; lsSet(s); }
function isFaved(a) { var s=lsGet(); return s.favorites&&s.favorites.indexOf(a)>=0; }
function toggleFav(a) { var s=lsGet(); if(!s.favorites)s.favorites=[]; var i=s.favorites.indexOf(a); if(i>=0)s.favorites.splice(i,1); else s.favorites.push(a); lsSet(s); }
function isDeleted(a) { var s=lsGet(); return s.deleted&&s.deleted.indexOf(a)>=0; }
function markDeleted(a) { var s=lsGet(); if(!s.deleted)s.deleted=[]; s.deleted.push(a); lsSet(s); }

// ═══════════════════════════════════════
// Swipe-to-delete
// ═══════════════════════════════════════
var swipeState = { el:null, startX:0, startY:0, offset:0, swiping:false };

function resetSwipe() {
  if (swipeState.el) {
    swipeState.el.querySelector('.swipe-card').style.transform = '';
    swipeState.el.querySelector('.swipe-bg').classList.remove('show');
    swipeState.el = null;
  }
  swipeState.offset = 0;
  swipeState.swiping = false;
}

document.addEventListener('touchstart', function(e) {
  var wrapper = e.target.closest('.swipe-wrapper');
  if (!wrapper) { resetSwipe(); return; }
  if (swipeState.el && swipeState.el !== wrapper) resetSwipe();
  swipeState.el = wrapper;
  swipeState.startX = e.touches[0].clientX;
  swipeState.startY = e.touches[0].clientY;
  swipeState.offset = 0;
}, {passive:true});

document.addEventListener('touchmove', function(e) {
  if (!swipeState.el) return;
  var dx = e.touches[0].clientX - swipeState.startX;
  var dy = e.touches[0].clientY - swipeState.startY;
  if (!swipeState.swiping && Math.abs(dx) < 10) return;
  if (!swipeState.swiping) {
    if (Math.abs(dy) > Math.abs(dx)) { resetSwipe(); return; }
    swipeState.swiping = true;
  }
  if (dx > 10) { resetSwipe(); return; } // only left swipe
  swipeState.offset = Math.max(-120, Math.min(0, dx));
  swipeState.el.querySelector('.swipe-card').style.transform = 'translateX('+swipeState.offset+'px)';
  swipeState.el.querySelector('.swipe-bg').classList.toggle('show', swipeState.offset < -40);
}, {passive:true});

document.addEventListener('touchend', function() {
  if (!swipeState.el) return;
  if (swipeState.offset < -80) {
    // delete
    var aid = swipeState.el.getAttribute('data-arxiv');
    markDeleted(aid);
    swipeState.el.style.transition = 'transform .2s ease-out, opacity .2s';
    swipeState.el.style.transform = 'translateX(-100%)';
    swipeState.el.style.opacity = '0';
    setTimeout(function() {
      if (swipeState.el) swipeState.el.remove();
      resetSwipe();
    }, 250);
  } else {
    swipeState.el.querySelector('.swipe-card').style.transform = '';
    swipeState.el.querySelector('.swipe-bg').classList.remove('show');
    resetSwipe();
  }
});

// ═══════════════════════════════════════
// Pull-to-refresh
// ═══════════════════════════════════════
var ptrState = { startY:0, pulling:false, indicator:null, panel:null };
document.addEventListener('touchstart', function(e) {
  if (window.scrollY > 5 || ptrState.pulling) return;
  ptrState.startY = e.touches[0].clientY;
  ptrState.indicator = document.querySelector('.panel.active .ptr-indicator');
  if (!ptrState.indicator) return;
}, {passive:true});

document.addEventListener('touchmove', function(e) {
  if (!ptrState.indicator || ptrState.pulling) return;
  var dy = e.touches[0].clientY - ptrState.startY;
  if (dy > 40 && window.scrollY < 2) {
    ptrState.pulling = true;
    ptrState.indicator.classList.add('show');
    ptrState.indicator.textContent = '下拉刷新 · 打乱顺序';
  }
}, {passive:true});

document.addEventListener('touchend', function() {
  if (!ptrState.indicator || !ptrState.pulling) return;
  ptrState.pulling = false;
  ptrState.indicator.classList.add('refreshing');
  ptrState.indicator.innerHTML = '<span class="spinner">↻</span> 刷新中...';
  setTimeout(function() {
    ptrState.indicator.classList.remove('refreshing','show');
    ptrState.indicator.textContent = '';
    var activePanel = document.querySelector('.panel.active');
    if (activePanel) {
      var panelId = activePanel.id;
      if (panelId === 'panel-papers' && currentKey != null) {
        renderPapers(parseInt(currentKey), true);
      } else if (panelId === 'panel-prx') {
        renderPrx(true);
      }
    }
    ptrState.indicator = null;
  }, 300);
}, {passive:false});

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  var tab=document.querySelector('[data-tab="'+name+'"]'); if(tab)tab.classList.add('active');
  var panel=document.getElementById('panel-'+name); if(panel)panel.classList.add('active');
  if(name==='favs') renderFavs();
}

function toggleFG(id) {
  var el=document.getElementById(id), btn=document.getElementById('btn-'+id);
  if(!el||!btn)return;
  if(el.classList.contains('expanded')){el.classList.remove('expanded');btn.textContent='展开全文';}
  else{el.classList.add('expanded');btn.textContent='收起';}
}

// papers
var currentKey=null;
var CURRENT_PAPERS=null; // cache for shuffle
function selectDate(key){if(key==null)return;currentKey=key;document.querySelectorAll('#panel-papers .date-chip').forEach(c=>c.classList.remove('active'));var chip=document.querySelector('#panel-papers [data-key="'+key+'"]');if(chip)chip.classList.add('active');renderPapers(parseInt(key));}

function shuffleArray(arr) {
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

function renderPapers(idx, doShuffle){
  var c=document.getElementById('paper-list');if(!c)return;
  var e=PAPER_DATA[idx];if(!e){c.innerHTML='<div class="empty">暂无文献</div>';return;}
  var papers=e.papers.filter(function(p){return !isDeleted(p.arxiv||p.doi||'');});
  if(doShuffle) papers=shuffleArray(papers);
  CURRENT_PAPERS=papers;
  if(papers.length===0){c.innerHTML='<div class="empty">该日期文献已全部删除</div>';return;}
  var h='';
  papers.forEach(function(p){
    var aid=p.arxiv||p.doi||'';
    var pdfUrl=aid&&!p.doi?'https://arxiv.org/pdf/'+aid+'.pdf':'';
    var absUrl=aid&&!p.doi?'https://arxiv.org/abs/'+aid:'';
    if(p.doi){pdfUrl='https://doi.org/'+p.doi;absUrl=pdfUrl;}
    var rating=getRating(aid),faved=isFaved(aid);
    var starsH='';for(var s=1;s<=5;s++)starsH+='<span class="star'+(s<=rating?' lit':'')+'">★</span>';
    var fc=faved?' faved':'', ft=faved?'❤ 已收藏':'♡ 收藏';
    var coreH=p.core?esc(p.core):'<span class="empty-field">（暂无）</span>';
    var absH=p.abstract?esc(p.abstract):'<span class="empty-field">（暂无翻译）</span>';
    var reasonH=p.reason?esc(p.reason):'<span class="empty-field">（暂无）</span>';
    var authorH=p.authors?esc(p.authors):'';
    var metaParts=[];
    if(!p.doi)metaParts.push('arxiv:'+esc(aid));
    if(p.doi)metaParts.push('DOI: '+esc(p.doi));
    if(p.rating)metaParts.push(esc(p.rating));
    if(pdfUrl)metaParts.push('<a href="'+pdfUrl+'" target="_blank">PDF</a>');
    if(absUrl&&!p.doi)metaParts.push('<a href="'+absUrl+'" target="_blank">arXiv</a>');
    h+='<div class="swipe-wrapper" data-arxiv="'+esc(aid)+'">';
    h+='<div class="swipe-bg">删除</div>';
    h+='<div class="swipe-card">';
    h+='<div class="paper-title">'+esc(p.title)+'</div>';
    h+='<div class="paper-meta">'+metaParts.join(' <span class="sep">|</span> ')+'</div>';
    if(authorH)h+='<div class="paper-authors">'+authorH+'</div>';
    h+='<div class="paper-field"><div class="paper-field-label">核心洞察</div><div class="paper-field-text">'+coreH+'</div></div>';
    h+='<div class="paper-field"><div class="paper-field-label">摘要翻译</div><div class="paper-field-text">'+absH+'</div></div>';
    h+='<div class="paper-field"><div class="paper-field-label">推荐理由</div><div class="paper-field-text">'+reasonH+'</div></div>';
    h+='<div class="paper-actions"><div class="stars" data-arxiv="'+esc(aid)+'">'+starsH+'</div><button class="fav-btn'+fc+'" data-arxiv="'+esc(aid)+'">'+ft+'</button></div>';
    h+='</div></div>';
  });
  c.innerHTML=h;
  c.querySelectorAll('.stars').forEach(function(el){el.addEventListener('click',function(e){var star=e.target.closest('.star');if(!star)return;var idx=Array.from(el.children).indexOf(star);var stars=idx+1;var aid=el.getAttribute('data-arxiv');var cur=getRating(aid);setRating(aid,stars===cur?0:stars);if(currentKey!=null)renderPapers(parseInt(currentKey));});});
  c.querySelectorAll('.fav-btn').forEach(function(btn){btn.addEventListener('click',function(){var aid=btn.getAttribute('data-arxiv');toggleFav(aid);if(currentKey!=null)renderPapers(parseInt(currentKey));});});
}

// PRX Life stream — no date selector, just infinite scroll style
var CURRENT_PRX=null;
function renderPrx(doShuffle){
  var c=document.getElementById('prx-list');if(!c)return;
  var papers=PRX_DATA.filter(function(p){return !isDeleted(p.doi||'');});
  if(doShuffle) papers=shuffleArray(papers);
  CURRENT_PRX=papers;
  if(papers.length===0){c.innerHTML='<div class="empty">暂无 PRX Life 推送</div>';return;}
  var h='';
  papers.forEach(function(p){
    var doi=p.doi||'';
    var pdfUrl=doi?'https://doi.org/'+doi:'';
    var h2=p.highlight||'';
    var abs=p.abstract_cn||'';
    var authors=p.authors||'';
    h+='<div class="swipe-wrapper" data-arxiv="'+esc(doi)+'">';
    h+='<div class="swipe-bg">删除</div>';
    h+='<div class="swipe-card">';
    h+='<div class="paper-title">'+esc(p.title)+'</div>';
    h+='<div class="paper-meta">'+esc(p.date||'');
    if(p.journal)h+=' · '+esc(p.journal);
    if(doi)h+=' · <a href="'+pdfUrl+'" target="_blank">DOI</a>';
    if(pdfUrl)h+=' · <a href="'+pdfUrl+'" target="_blank">PDF</a>';
    h+='</div>';
    if(authors)h+='<div class="paper-authors">'+esc(authors)+'</div>';
    h+='<div class="paper-field"><div class="paper-field-label">核心洞察 / 物理亮点</div><div class="paper-field-text">'+(h2?esc(h2):'<span class="empty-field">（暂无）</span>')+'</div></div>';
    h+='<div class="paper-field"><div class="paper-field-label">摘要翻译</div><div class="paper-field-text">'+(abs?esc(abs):'<span class="empty-field">（暂无翻译）</span>')+'</div></div>';
    h+='</div></div>';
  });
  c.innerHTML=h;
}

// favorites
function renderFavs(){
  var c=document.getElementById('fav-list');if(!c)return;
  var s=lsGet(),favs=s.favorites||[];
  if(favs.length===0){c.innerHTML='<div class="empty">还没有收藏任何论文</div>';return;}
  var all=[];
  PAPER_DATA.forEach(function(e){e.papers.forEach(function(p){if(p.arxiv&&favs.indexOf(p.arxiv)>=0)all.push({paper:p,date:e.date,label:e.label});});});
  if(all.length===0){c.innerHTML='<div class="empty">还没有收藏任何论文</div>';return;}
  var h='';
  all.forEach(function(item){var p=item.paper;
    h+='<div class="paper-card"><div class="paper-title">'+esc(p.title)+'</div><div class="paper-meta">arxiv:'+esc(p.arxiv)+' · '+esc(item.date)+'</div>';
    if(p.core)h+='<div class="paper-field"><div class="paper-field-label">核心洞察</div><div class="paper-field-text">'+esc(p.core)+'</div></div>';
    h+='</div>';
  });
  c.innerHTML=h;
}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
<script>document.addEventListener("DOMContentLoaded",function(){selectDate("0");renderPrx();});</script>
